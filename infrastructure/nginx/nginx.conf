# Reverse proxy for the PatrolBot dashboard (Phase 5).
#
# TLS terminates here; the app server stays on loopback :8000. WebSockets
# (/ws/ui from browsers, /ws/robot from the Pi bridge) need the Upgrade
# headers and long read timeouts.

worker_processes 1;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream dashboard {
        server 127.0.0.1:8000;
    }

    # Rate/connection limits (defense in depth; the app enforces per-operator
    # command limits itself). Cap API request rate and concurrent WS sockets
    # per client IP.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=wsconn:10m;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        # Self-signed dev certs from generate-certs.sh; swap for real ones
        # (e.g. certbot) by replacing these two files.
        ssl_certificate /etc/nginx/certs/dashboard.crt;
        ssl_certificate_key /etc/nginx/certs/dashboard.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # The map payload is ~1 MB JSON; recordings exports can be larger.
        client_max_body_size 16m;
        gzip on;
        gzip_types application/json text/css application/javascript;

        location /ws/ {
            limit_conn wsconn 8;
            proxy_pass http://dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
