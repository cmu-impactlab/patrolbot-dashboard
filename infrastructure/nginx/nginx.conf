worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream dashboard {
        server server:8000;
        keepalive 16;
    }

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=wsconn:10m;

    server {
        listen 80;
        listen [::]:80;

        server_name patrolbot-dashboard.qatar.cmu.edu;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443;

        server_name patrolbot-dashboard.qatar.cmu.edu;

        ssl_certificate /etc/letsencrypt/live/patrolbot-dashboard.qatar.cmu.edu/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/patrolbot-dashboard.qatar.cmu.edu/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 16m;

        # nginx's add_header does not merge: a single add_header inside any
        # location below would drop every one of these for that location. Keep
        # them here, and keep locations free of add_header.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # A year, and no includeSubDomains/preload: those commit names this
        # deployment does not control and are far harder to walk back than the
        # certificate renewal this depends on.
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Everything the dashboard loads is same-origin and built into the
        # image — no CDN, no web fonts, no analytics. img-src allows data: for
        # the resize-handle SVG the grid CSS inlines. frame-ancestors is the
        # enforceable version of the X-Frame-Options line above.
        #
        # style-src 'unsafe-inline' is required by the sign-in rejection page,
        # which is server-rendered with an inline <style> block (see
        # server/app/authentication/oidc.py). The React bundle itself does not
        # need it — React applies the style prop by assigning properties on
        # element.style, which style-src does not reach — so tightening this to
        # 'self' means giving that page a stylesheet or a nonce first. Scripts
        # stay strict either way, which is where an injected payload would
        # actually run.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        location /ws/ {
            limit_conn wsconn 8;

            proxy_pass http://dashboard;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://dashboard;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
