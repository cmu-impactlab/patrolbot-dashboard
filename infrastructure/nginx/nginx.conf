worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream dashboard {
        server server:8000;
        keepalive 16;
    }

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=wsconn:10m;

    server {
        listen 80;
        listen [::]:80;

        server_name patrolbot-dashboard.qatar.cmu.edu;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443;

        server_name patrolbot-dashboard.qatar.cmu.edu;

        ssl_certificate /etc/letsencrypt/live/patrolbot-dashboard.qatar.cmu.edu/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/patrolbot-dashboard.qatar.cmu.edu/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 16m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Enable only after valid HTTPS is confirmed:
        # add_header Strict-Transport-Security "max-age=31536000" always;

        location /ws/ {
            limit_conn wsconn 8;

            proxy_pass http://dashboard;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://dashboard;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
