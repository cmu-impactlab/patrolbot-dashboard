# Production-shaped deployment: nginx TLS front + dashboard server.
#
#   ./infrastructure/nginx/generate-certs.sh        # once (or install real certs)
#   PATROLBOT_ROBOT_TOKEN=<secret> docker compose \
#       -f infrastructure/docker-compose.production.yml up -d --build
#   -> dashboard at https://<host>/  (port 80 redirects)
#
# The Pi bridge should point WEB_BRIDGE_SERVER_URL at ws://<host>:8000/ws/robot
# (direct, LAN/VPN) or wss://<host>/ws/robot to go through nginx.
#
# Optional PostgreSQL: set PATROLBOT_DATABASE_URL=postgresql://... on the
# server service; without it SQLite in the server-data volume is used.
#
# Host networking for the same reason as the local compose: the robot
# bridge connects to <host>:8000, and some hosts (including the current dev
# laptop) drop host<->docker-bridge traffic.
services:
  server:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.server
      network: host
    network_mode: host
    environment:
      # Fail closed on insecure config (dev secrets, missing OIDC/origins/TLS).
      PATROLBOT_ENVIRONMENT: production
      PATROLBOT_AUTH_MODE: oidc
      PATROLBOT_ROBOT_TOKEN: ${PATROLBOT_ROBOT_TOKEN:?set a real robot token}
      PATROLBOT_SESSION_SECRET: ${PATROLBOT_SESSION_SECRET:?set a non-default session secret}
      PATROLBOT_OIDC_ISSUER: ${PATROLBOT_OIDC_ISSUER:-https://accounts.google.com}
      PATROLBOT_OIDC_CLIENT_ID: ${PATROLBOT_OIDC_CLIENT_ID:?set the Google OAuth client id}
      PATROLBOT_OIDC_CLIENT_SECRET: ${PATROLBOT_OIDC_CLIENT_SECRET:?set the Google OAuth client secret}
      PATROLBOT_OIDC_REDIRECT_URL: ${PATROLBOT_OIDC_REDIRECT_URL:?set the https callback url}
      PATROLBOT_OIDC_EMAIL_DOMAIN: ${PATROLBOT_OIDC_EMAIL_DOMAIN:-andrew.cmu.edu}
      PATROLBOT_ALLOWED_ORIGINS: ${PATROLBOT_ALLOWED_ORIGINS:?set the dashboard origin(s)}
      # Restrict sign-in to specific Andrew IDs (e.g. "yousefh"); empty = anyone
      # with a verified @andrew.cmu.edu account.
      PATROLBOT_ALLOWED_USERNAMES: ${PATROLBOT_ALLOWED_USERNAMES:-}
      PATROLBOT_OPERATOR_USERNAMES: ${PATROLBOT_OPERATOR_USERNAMES:-}
      PATROLBOT_ADMIN_USERNAMES: ${PATROLBOT_ADMIN_USERNAMES:-}
      PATROLBOT_DATABASE_PATH: /data/patrolbot.db
      PATROLBOT_STATIC_MAP_YAML: /maps/cmuq-floor2/second_map.yaml
    volumes:
      - server-data:/data
    restart: always

  nginx:
    image: nginx:1.27-alpine
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - server
    restart: always

volumes:
  server-data:
