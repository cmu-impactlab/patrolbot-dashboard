name: patrolbot-dashboard

services:
  server:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.server

    environment:
      PATROLBOT_ENVIRONMENT: production
      PATROLBOT_AUTH_MODE: oidc
      PATROLBOT_ROBOT_TOKEN: ${PATROLBOT_ROBOT_TOKEN:?missing robot token}
      PATROLBOT_SESSION_SECRET: ${PATROLBOT_SESSION_SECRET:?missing session secret}
      PATROLBOT_OIDC_ISSUER: ${PATROLBOT_OIDC_ISSUER:?missing OIDC issuer}
      PATROLBOT_OIDC_CLIENT_ID: ${PATROLBOT_OIDC_CLIENT_ID:?missing OIDC client ID}
      PATROLBOT_OIDC_CLIENT_SECRET: ${PATROLBOT_OIDC_CLIENT_SECRET:?missing OIDC client secret}
      PATROLBOT_OIDC_REDIRECT_URL: ${PATROLBOT_OIDC_REDIRECT_URL:?missing redirect URL}
      PATROLBOT_OIDC_EMAIL_DOMAIN: ${PATROLBOT_OIDC_EMAIL_DOMAIN:-andrew.cmu.edu}
      PATROLBOT_ALLOWED_ORIGINS: ${PATROLBOT_ALLOWED_ORIGINS:?missing allowed origin}
      PATROLBOT_ALLOWED_USERNAMES: ${PATROLBOT_ALLOWED_USERNAMES:-}
      PATROLBOT_OPERATOR_USERNAMES: ${PATROLBOT_OPERATOR_USERNAMES:-}
      PATROLBOT_ADMIN_USERNAMES: ${PATROLBOT_ADMIN_USERNAMES:-}
      PATROLBOT_DATABASE_PATH: /data/patrolbot.db
      PATROLBOT_STATIC_MAP_YAML: /maps/cmuq-floor2/second_map.yaml

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*

    expose:
      - "8000"

    volumes:
      - server-data:/data

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    restart: unless-stopped
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /srv/patrolbot-dashboard/acme:/var/www/certbot:ro

    depends_on:
      server:
        condition: service_healthy

    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  server-data:
    name: patrolbot-dashboard-data
