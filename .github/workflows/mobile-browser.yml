name: Mobile browser acceptance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - run: npm run check:e2e
        working-directory: frontend
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/3 --reporter=line
        working-directory: frontend
      - if: matrix.shard == 1
        run: python -m venv server/.venv
      - if: matrix.shard == 1
        run: server/.venv/bin/pip install ./server ./mock-robot
      - if: matrix.shard == 1
        run: npm run test:mock-browser
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: mobile-browser-traces-${{ matrix.shard }}
          path: |
            frontend/test-results/
            frontend/test-results-mock/
          retention-days: 7
