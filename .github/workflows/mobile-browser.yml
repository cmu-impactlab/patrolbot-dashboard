name: Manual browser acceptance

on:
  workflow_dispatch:

jobs:
  browser:
    # Optional operator-invoked acceptance only. PR/main CI keeps the frontend
    # unit tests, TypeScript and production build in ci.yml; no browser shards.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Match frontend/package-lock.json. Browsers AND native libraries are baked
    # into this immutable image: installing them from the runner's apt mirror
    # consumed the entire job timeout before any test ran (twice on PR #38).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host --init
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Verify preinstalled browser runtime
        run: node ../scripts/check-browser-runtime.mjs
        timeout-minutes: 2
        working-directory: frontend
      - run: npm run check:e2e
        working-directory: frontend
      - run: npm run test:e2e -- --reporter=line
        working-directory: frontend
      - run: python -m venv server/.venv
      - run: server/.venv/bin/pip install ./server ./mock-robot
      - run: npm run test:mock-browser
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: manual-browser-traces
          path: |
            frontend/test-results/
            frontend/test-results-mock/
          retention-days: 7
