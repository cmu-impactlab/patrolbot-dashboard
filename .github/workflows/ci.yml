name: CI

on:
  push:
    branches: [main]
  pull_request:

# The Python range the project actually claims to support (see
# `requires-python = ">=3.11"`). It is tested rather than assumed: the suite
# was once verified only on the maintainer's local interpreter, and a report of
# a hang on a newer version could not be told apart from an unsupported one.
# 3.12 stays first because it is what the production image ships.

jobs:
  server:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "./server[dev]"
      - run: python -m pytest -q
        working-directory: server

  mock-robot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "./mock-robot[dev]"
      - run: python -m pytest -q
        working-directory: mock-robot

  bridge:
    # Pure-Python tests only (normalizers, throttling, command pre-checks);
    # no ROS graph is needed.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pytest-timeout
      - run: python -m pytest test -q
        working-directory: ros2_ws/src/patrolbot_web_bridge

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npx vitest run
        working-directory: frontend
      - run: npx vite build
        working-directory: frontend
