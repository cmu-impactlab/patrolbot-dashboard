[project]
name = "patrolbot-dashboard-server"
version = "0.1.0"
description = "PatrolBot dashboard server: telemetry hub, REST API, WebSocket gateways"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "aiosqlite>=0.20",
    "websockets>=13",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]
postgres = ["asyncpg>=0.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Fail loudly instead of hanging if a test blocks on an unavailable service,
# and surface the slowest tests so regressions in determinism are visible.
addopts = "--durations=10 -ra"
# No test here is legitimately slow — the whole suite runs in well under 10s.
# A test that blocks is a bug (a TestClient lifespan that never completes, a
# socket waiting on a service that is not running), and the failure has to be
# a report rather than a hung `make test` that someone eventually ctrl-Cs.
# thread method: signal-based timeouts do not fire inside a blocked C call.
timeout = 60
timeout_method = "thread"
markers = [
    "external: needs an external service (e.g. PostgreSQL); excluded from the default hermetic run",
]
